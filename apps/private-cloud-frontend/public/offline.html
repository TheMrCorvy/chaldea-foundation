<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Private Cloud</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .button:hover {
            background: #764ba2;
        }

        .retry-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #f0f0f0;
            color: #333;
            border: 2px solid #667eea;
        }

        .retry-btn:hover {
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📵</div>
        <h1>Sin conexión</h1>
        <p>
            Parece que no tienes conexión a internet. Algunos contenidos en caché pueden estar disponibles,
            pero las nuevas solicitudes no pueden procesarse en este momento.
        </p>
        <button class="button retry-btn" onclick="window.location.reload()">
            Reintentar
        </button>
    </div>

    <script>
        // Try to reconnect when connection is restored
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
